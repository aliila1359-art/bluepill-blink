name: Build STM32 Firmware

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install ARM Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Compile Code
        run: |
          # دستور کامپایل ساده برای ساخت فایل باینری
          arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -c main.c -o main.o
          # (در پروژه‌های واقعی فایل لینک‌کر و استارت‌آپ هم اضافه می‌شود)
